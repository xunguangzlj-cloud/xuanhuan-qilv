<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>旋环奇旅</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f9ecdf;font-family:sans-serif;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
body{display:flex;justify-content:center;align-items:center}canvas{display:block;touch-action:none}
#toast{position:fixed;bottom:12%;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:10px;color:#fff;background:#5c4636dd;max-width:75%;text-align:center;opacity:0;pointer-events:none;transition:opacity .15s}
</style>
<canvas id="game"></canvas><div id="toast"></div>
<script>let toastTimer;window.addEventListener('game-toast',event=>{const toast=document.getElementById('toast');toast.textContent=event.detail;toast.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.opacity=0,2200)});</script>
<script src="preview.bundle.js"></script>
</html>
